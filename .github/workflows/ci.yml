name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1 # matches engines in package.json
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: openzcash_x_research_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d openzcash_x_research_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ZARVIS_X_RESEARCH_TEST_DB_URL: postgres://ci:ci@127.0.0.1:5432/openzcash_x_research_test
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.22.1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:copilot

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Dummy value, never connected: only the env schema in src/lib/config/env.ts
      # reads it, and every data page is dynamic, so no query runs at build time.
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: next-${{ runner.os }}-
      - run: npm run build

  services:
    name: Service (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [participate, private-chat]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --maxWorkers=2
      - if: matrix.service == 'participate'
        run: npm run test:runtime
      - run: npm run build
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci

  participate-database:
    name: Participate database integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: community_treasury_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: services/participate
    env:
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/community_treasury_tests
      TREASURY_TEST_DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/community_treasury_tests
      PARTICIPATE_TEST_PORT: '5432'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: services/participate/package-lock.json
      - run: npm ci
      - run: npm run db:setup
      - name: Create isolated demo test database
        run: createdb -h 127.0.0.1 -U ci participate_demo_test
        env:
          PGPASSWORD: ci
      - name: Install demo test schema
        run: npm run db:setup
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/participate_demo_test
      - run: npm test -- --maxWorkers=2
        env:
          PARTICIPATE_DEMO_TEST_DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/participate_demo_test

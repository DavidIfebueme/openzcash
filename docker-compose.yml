# Local backend infrastructure for running the retired wallet engine fully LOCAL:
#   - zkool: wallet engine (zkool_graphql) connected to a public lightwalletd (zec.rocks)
#   - db:    application Postgres (OPTIONAL - only starts with `--profile db`; if you
#            already have local Postgres, ignore this and point DATABASE_URL at it)
#
# Usage:
#   docker compose up -d zkool                 # engine only (recommended if you have Postgres)
#   docker compose --profile db up -d          # engine + containerized Postgres
#
# The Next.js app runs outside compose (`npm run dev`) pointing at:
#   ZCASH_GATEWAY=zkool
#   ZKOOL_GRAPHQL_URL=http://localhost:8000/graphql

services:
  zkool:
    build:
      context: .
      dockerfile: docker/zkool-graphql.Dockerfile
      args:
        ZKOOL_REF: main # fixe numa tag/commit p/ reprodutibilidade
    ports:
      - "8000:8000" # GraphQL em http://localhost:8000/graphql
    volumes:
      - zkool-data:/data
    restart: unless-stopped
    # For testnet, uncomment (uses the testnet lightwalletd):
    # command: ["-d", "/data/zkool.db", "-l", "https://lwd.testnet.zcash-infra.com:9067", "-p", "8000"]

  db:
    image: postgres:16
    profiles: ["db"] # optional - `docker compose --profile db up`
    environment:
      POSTGRES_DB: openzcash
      POSTGRES_USER: zec
      POSTGRES_PASSWORD: zec
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  zkool-data:
  pg-data:
